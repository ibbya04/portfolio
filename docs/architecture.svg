<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="Simplified Animated AWS Serverless Portfolio Architecture">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="760" height="408" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="20" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AWS Serverless Architecture · Request Flow</text>
  <circle cx="478" cy="24" r="4" fill="#34d399" />
  <text x="488" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Website Delivery</text>
  <circle cx="598" cy="24" r="4" fill="#fbbf24" />
  <text x="608" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Visitor Counter API</text>

  <!-- AWS Cloud Boundary -->
  <rect x="208" y="42" width="534" height="352" rx="10" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 4" />
  <text x="222" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#94a3b8">AWS Cloud (eu-north-1)</text>

  <!-- Top Lane: Website Delivery -->
  <rect x="222" y="70" width="506" height="114" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
  <text x="234" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#34d399">1 · STATIC WEBSITE</text>

  <!-- Bottom Lane: Visitor Counter API -->
  <rect x="222" y="198" width="506" height="182" rx="8" fill="#111827" stroke="#78350f" stroke-width="1" />
  <text x="234" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#fbbf24">2 · VISITOR COUNTER API</text>

  <!-- NODE: Visitor Browser -->
  <rect x="18" y="138" width="132" height="148" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <text x="84" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Visitor Browser</text>
  <line x1="30" y1="176" x2="138" y2="176" stroke="#1e293b" stroke-width="1" />
  <text x="84" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#34d399">1. Opens portfolio</text>
  <text x="84" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#fbbf24">2. Calls visitor API</text>
  <text x="84" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#94a3b8">3. Shows live count</text>
  <rect x="34" y="250" width="100" height="24" rx="6" fill="#0b1120" stroke="#34d399" stroke-opacity="0.6" stroke-width="1" />
  <text x="84" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#34d399">visitors: N</text>

  <!-- NODE: CloudFront -->
  <rect x="236" y="98" width="194" height="72" rx="8" fill="#0b1120" stroke="#34d399" stroke-width="1.5" />
  <text x="333" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">Amazon CloudFront</text>
  <text x="333" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#34d399">Global HTTPS CDN</text>
  <text x="333" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#94a3b8">Serves cached website</text>

  <!-- NODE: Private S3 -->
  <g opacity="0.78">
    <rect x="526" y="98" width="186" height="72" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="619" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Private S3 Bucket</text>
    <text x="619" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#cbd5e1">Stores website files</text>
    <text x="619" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">Private (CloudFront only)</text>
  </g>
  <path d="M 430 134 L 521 134" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-muted)" />
  <text x="476" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#94a3b8">if not cached</text>

  <!-- NODE: API Gateway -->
  <rect x="236" y="230" width="136" height="90" rx="8" fill="#0b1120" stroke="#fbbf24" stroke-width="1.5" />
  <text x="304" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">API Gateway</text>
  <text x="304" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#fbbf24">Public HTTPS endpoint</text>
  <text x="304" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">CORS &amp; rate-limited</text>

  <!-- NODE: AWS Lambda -->
  <rect x="412" y="230" width="138" height="90" rx="8" fill="#0b1120" stroke="#fbbf24" stroke-width="1.5" />
  <text x="481" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">AWS Lambda</text>
  <text x="481" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#fbbf24">Python function</text>
  <text x="481" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">Updates visitor count</text>

  <!-- NODE: DynamoDB -->
  <rect x="590" y="230" width="122" height="90" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
  <text x="651" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">DynamoDB</text>
  <text x="651" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#38bdf8">Serverless database</text>
  <text x="651" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">Stores total visits</text>

  <!-- CloudWatch Logs -->
  <rect x="412" y="342" width="138" height="24" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1.1" />
  <text x="481" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">CloudWatch Logs</text>
  <path d="M 481 320 L 481 338" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr-blue)" />

  <!-- WIRES -->
  <path d="M 150 174 L 178 174 L 178 122 L 231 122" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-green)" />
  <text x="184" y="113" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.6" font-weight="600" fill="#34d399">Request</text>

  <path d="M 236 148 L 192 148 L 192 198 L 155 198" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-green)" />
  <text x="188" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.4" fill="#34d399">HTML &amp; JS</text>

  <path d="M 150 248 L 184 248 L 184 264 L 231 264" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="186" y="239" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.6" font-weight="600" fill="#fbbf24">API Call</text>

  <path d="M 372 264 L 407 264" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="391" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#fbbf24">triggers</text>

  <path d="M 550 264 L 585 264" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="569" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#38bdf8">+1</text>

  <path d="M 590 292 L 555 292" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-blue)" />
  <text x="571" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#38bdf8">new total</text>

  <path d="M 412 292 L 377 292" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
  <text x="393" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#fbbf24">count</text>

  <path d="M 236 292 L 168 292 L 168 266 L 155 266" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
  <text x="190" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.4" fill="#fbbf24">Visitor count</text>

  <!-- PURE SVG ANIMATED PACKETS -->
  <circle r="4.5" fill="#34d399" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="0s;p6.end+0.8s" id="p1" fill="remove" path="M 150 174 L 178 174 L 178 122 L 231 122" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.2s" begin="p1.begin" />
  </circle>
  <circle r="4.5" fill="#34d399" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="p1.end" id="p2" fill="remove" path="M 236 148 L 192 148 L 192 198 L 155 198" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.2s" begin="p2.begin" />
  </circle>
  <circle r="4.5" fill="#fbbf24" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.3s" begin="p2.end+0.2s" id="p3" fill="remove" path="M 150 248 L 184 248 L 184 264 L 231 264 M 372 264 L 407 264" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.3s" begin="p3.begin" />
  </circle>
  <circle r="4.5" fill="#38bdf8" filter="url(#glow)" opacity="0">
    <animateMotion dur="0.9s" begin="p3.end" id="p4" fill="remove" path="M 550 264 L 585 264" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.9s" begin="p4.begin" />
  </circle>
  <circle r="4.5" fill="#38bdf8" filter="url(#glow)" opacity="0">
    <animateMotion dur="0.9s" begin="p4.end+0.15s" id="p5" fill="remove" path="M 590 292 L 555 292" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.9s" begin="p5.begin" />
  </circle>
  <circle r="4.5" fill="#fbbf24" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.3s" begin="p5.end" id="p6" fill="remove" path="M 412 292 L 377 292 M 236 292 L 168 292 L 168 266 L 155 266" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.3s" begin="p6.begin" />
  </circle>
</svg>
