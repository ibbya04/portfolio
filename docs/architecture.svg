<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" role="img" aria-label="Animated AWS Serverless Portfolio Request Flow Architecture">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Card Background (renders cleanly on both GitHub Light & Dark themes) -->
  <rect x="0" y="0" width="760" height="448" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="20" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AWS Serverless Architecture · Live Request Flow</text>
  <circle cx="436" cy="24" r="4" fill="#34d399" />
  <text x="446" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Static Edge Cache</text>
  <circle cx="554" cy="24" r="4" fill="#fbbf24" />
  <text x="564" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Visitor API</text>
  <circle cx="638" cy="24" r="4" fill="#38bdf8" />
  <text x="648" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">IAM / DynamoDB</text>

  <!-- AWS Account Boundary -->
  <rect x="208" y="42" width="534" height="392" rx="10" fill="none" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 4" />
  <text x="222" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#94a3b8">AWS Region: eu-north-1 (Stockholm) · Provisioned with Terraform</text>

  <!-- Top Lane: Static Frontend -->
  <rect x="222" y="70" width="506" height="128" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
  <text x="234" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#34d399">PART 1 · STATIC PAGE DELIVERY (CACHED AT EDGE)</text>

  <!-- Bottom Lane: Serverless API -->
  <rect x="222" y="212" width="506" height="208" rx="8" fill="#111827" stroke="#78350f" stroke-width="1" />
  <text x="234" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#fbbf24">PART 2 · LIVE SERVERLESS VISITOR COUNTER API</text>

  <!-- NODE: Visitor Browser -->
  <rect x="18" y="148" width="132" height="172" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <text x="84" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Visitor Browser</text>
  <text x="84" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.6" fill="#94a3b8">dd2cjuvwfp75y...</text>
  <line x1="30" y1="198" x2="138" y2="198" stroke="#1e293b" stroke-width="1" />
  <text x="84" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#34d399">1. GET / (HTTPS)</text>
  <text x="84" y="231" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#94a3b8">2. Run main.js</text>
  <text x="84" y="247" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.2" fill="#fbbf24">3. POST /visits</text>
  <rect x="30" y="266" width="108" height="38" rx="7" fill="#0b1120" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.2" />
  <text x="84" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.2" fill="#94a3b8">LIVE BADGE</text>
  <text x="84" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" font-weight="700" fill="#34d399">visitors: N</text>

  <!-- NODE: CloudFront -->
  <rect x="236" y="98" width="194" height="86" rx="8" fill="#0b1120" stroke="#34d399" stroke-width="1.5" />
  <text x="333" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">Amazon CloudFront</text>
  <text x="333" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#34d399">HTTPS Edge Cache · Shield</text>
  <rect x="260" y="145" width="146" height="26" rx="5" fill="#111827" stroke="#1e293b" stroke-width="1" />
  <text x="333" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#e2e8f0">index.html + main.js</text>

  <!-- NODE: Private S3 -->
  <g opacity="0.72">
    <rect x="526" y="98" width="186" height="86" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="619" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Private S3 Bucket</text>
    <text x="619" y="135" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.2" fill="#94a3b8">Public Access: BLOCKED</text>
    <text x="619" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.8" fill="#94a3b8">Skipped on cache hit</text>
    <text x="619" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" fill="#38bdf8">(OAC SigV4 fetch on miss)</text>
  </g>
  <path d="M 430 141 L 521 141" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-muted)" />
  <text x="476" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#94a3b8">cache miss only</text>

  <!-- NODE: API Gateway -->
  <rect x="236" y="244" width="136" height="118" rx="8" fill="#0b1120" stroke="#fbbf24" stroke-width="1.5" />
  <text x="304" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">API Gateway</text>
  <text x="304" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#fbbf24">HTTP API · POST /visits</text>
  <line x1="248" y1="290" x2="360" y2="290" stroke="#1e293b" stroke-width="1" />
  <text x="304" y="307" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.8" fill="#cbd5e1">• CORS: CloudFront only</text>
  <text x="304" y="323" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.8" fill="#cbd5e1">• Throttle: 5 req/sec</text>
  <text x="304" y="339" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.8" fill="#94a3b8">• AWS_PROXY v2.0</text>

  <!-- NODE: AWS Lambda -->
  <rect x="412" y="244" width="138" height="118" rx="8" fill="#0b1120" stroke="#fbbf24" stroke-width="1.5" />
  <text x="481" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">AWS Lambda</text>
  <text x="481" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#fbbf24">Python 3.13 · arm64</text>
  <line x1="424" y1="290" x2="538" y2="290" stroke="#1e293b" stroke-width="1" />
  <text x="481" y="307" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#cbd5e1">lambda_handler()</text>
  <text x="481" y="323" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.6" fill="#38bdf8">IAM: UpdateItem only</text>
  <text x="481" y="339" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.4" fill="#94a3b8">~20–50ms · $0 idle</text>

  <!-- NODE: DynamoDB -->
  <rect x="590" y="244" width="122" height="118" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
  <text x="651" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.2" font-weight="600" fill="#f8fafc">DynamoDB</text>
  <text x="651" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.2" fill="#38bdf8">PAY_PER_REQUEST</text>
  <line x1="602" y1="290" x2="700" y2="290" stroke="#1e293b" stroke-width="1" />
  <text x="651" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.6" fill="#cbd5e1">id: "portfolio"</text>
  <text x="651" y="325" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.2" font-weight="700" fill="#34d399">visits: N → N+1</text>
  <text x="651" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.3" fill="#94a3b8">Atomic ADD +1</text>

  <!-- CloudWatch Logs -->
  <rect x="412" y="382" width="138" height="24" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1.1" />
  <text x="481" y="398" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.6" fill="#94a3b8">CloudWatch Logs (14d)</text>
  <path id="w-cw" d="M 481 362 L 481 378" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr-blue)" />

  <!-- WIRES -->
  <path id="w-get" d="M 150 186 L 178 186 L 178 128 L 231 128" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-green)" />
  <text x="184" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.3" fill="#34d399">1. GET /</text>

  <path id="w-cache" d="M 236 156 L 192 156 L 192 210 L 155 210" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-green)" />
  <text x="186" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#34d399">2. HTML + JS</text>

  <path id="w-post" d="M 150 270 L 184 270 L 184 292 L 231 292" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="186" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.2" fill="#fbbf24">3. POST /visits</text>

  <path id="w-invoke" d="M 372 292 L 407 292" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="391" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#fbbf24">invoke</text>

  <path id="w-ddb-req" d="M 550 292 L 585 292" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="569" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#38bdf8">ADD +1</text>

  <path id="w-ddb-res" d="M 590 324 L 555 324" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-blue)" />
  <text x="571" y="338" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#38bdf8">new #</text>

  <path id="w-lambda-res" d="M 412 324 L 377 324" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
  <text x="393" y="338" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#fbbf24">200 JSON</text>

  <path id="w-api-res" d="M 236 324 L 168 324 L 168 290 L 155 290" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
  <text x="188" y="338" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#fbbf24">{"visits": N}</text>

  <!-- PURE SVG ANIMATED PACKETS (works natively in GitHub README without JS!) -->
  <!-- Packet 1: Static GET / -> CloudFront -> HTML/JS (0s - 2.6s of 8s loop) -->
  <circle r="4.5" fill="#34d399" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="0s;p6.end+0.8s" id="p1" fill="remove" path="M 150 186 L 178 186 L 178 128 L 231 128" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.2s" begin="p1.begin" />
  </circle>
  <circle r="4.5" fill="#34d399" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="p1.end" id="p2" fill="remove" path="M 236 156 L 192 156 L 192 210 L 155 210" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.2s" begin="p2.begin" />
  </circle>

  <!-- Packet 2: API POST /visits -> API Gateway -> Lambda -->
  <circle r="4.5" fill="#fbbf24" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.3s" begin="p2.end+0.2s" id="p3" fill="remove" path="M 150 270 L 184 270 L 184 292 L 231 292 M 372 292 L 407 292" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.3s" begin="p3.begin" />
  </circle>

  <!-- Packet 3: Lambda -> DynamoDB -> Lambda -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glow)" opacity="0">
    <animateMotion dur="0.9s" begin="p3.end" id="p4" fill="remove" path="M 550 292 L 585 292" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.9s" begin="p4.begin" />
  </circle>
  <circle r="4.5" fill="#38bdf8" filter="url(#glow)" opacity="0">
    <animateMotion dur="0.9s" begin="p4.end+0.15s" id="p5" fill="remove" path="M 590 324 L 555 324" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.9s" begin="p5.begin" />
  </circle>

  <!-- Packet 4: Lambda -> API Gateway -> Browser JSON Response -->
  <circle r="4.5" fill="#fbbf24" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.3s" begin="p5.end" id="p6" fill="remove" path="M 412 324 L 377 324 M 236 324 L 168 324 L 168 290 L 155 290" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.3s" begin="p6.begin" />
  </circle>
</svg>
