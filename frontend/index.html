<!doctype html>
<html lang="en" data-sky-time="night" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ibraheem — Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio and serverless cloud resume hosted on AWS S3, CloudFront, API Gateway, Lambda, and DynamoDB."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Kaushan+Script&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-indigo-500/25">
    <!-- Soft fluffy parting clouds intro overlay (auto-removed after parting) -->
    <div id="cloud-curtain" class="cloud-curtain" aria-hidden="true">
      <div class="curtain-mist"></div>

      <!-- Left fluffy cloud bank (filter-free radial gradients for smooth 60fps mobile compositing) -->
      <div class="curtain-cloud curtain-cloud-left">
        <svg viewBox="0 0 900 1000" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="curtain-base-l" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" style="stop-color: var(--curtain-deep)" stop-opacity="0.98" />
              <stop offset="56%" style="stop-color: var(--curtain-mid)" stop-opacity="0.92" />
              <stop offset="80%" style="stop-color: var(--curtain-light)" stop-opacity="0.52" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="curtain-puff-l" cx="44%" cy="50%" r="54%">
              <stop offset="0%" style="stop-color: var(--curtain-light)" stop-opacity="0.92" />
              <stop offset="45%" style="stop-color: var(--curtain-mid)" stop-opacity="0.72" />
              <stop offset="76%" style="stop-color: var(--curtain-mid)" stop-opacity="0.28" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="curtain-glow-l" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color: var(--curtain-light)" stop-opacity="0.55" />
              <stop offset="60%" style="stop-color: var(--curtain-light)" stop-opacity="0.18" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- Soft feathered cloud body -->
          <rect x="-40" y="-40" width="760" height="1080" fill="url(#curtain-base-l)" />
          <!-- Fluffy billowy cloud puffs along the parting seam -->
          <ellipse cx="595" cy="110" rx="285" ry="240" fill="url(#curtain-puff-l)" />
          <ellipse cx="645" cy="320" rx="295" ry="255" fill="url(#curtain-puff-l)" />
          <ellipse cx="615" cy="545" rx="305" ry="260" fill="url(#curtain-puff-l)" />
          <ellipse cx="640" cy="765" rx="295" ry="250" fill="url(#curtain-puff-l)" />
          <ellipse cx="585" cy="940" rx="280" ry="230" fill="url(#curtain-puff-l)" />
          <!-- Soft luminous inner cloud highlights -->
          <ellipse cx="510" cy="230" rx="220" ry="185" fill="url(#curtain-glow-l)" />
          <ellipse cx="545" cy="510" rx="240" ry="195" fill="url(#curtain-glow-l)" />
          <ellipse cx="505" cy="765" rx="225" ry="185" fill="url(#curtain-glow-l)" />
        </svg>
      </div>

      <!-- Right fluffy cloud bank (filter-free radial gradients for smooth 60fps mobile compositing) -->
      <div class="curtain-cloud curtain-cloud-right">
        <svg viewBox="0 0 900 1000" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="curtain-base-r" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0%" style="stop-color: var(--curtain-deep)" stop-opacity="0.98" />
              <stop offset="56%" style="stop-color: var(--curtain-mid)" stop-opacity="0.92" />
              <stop offset="80%" style="stop-color: var(--curtain-light)" stop-opacity="0.52" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="curtain-puff-r" cx="56%" cy="50%" r="54%">
              <stop offset="0%" style="stop-color: var(--curtain-light)" stop-opacity="0.92" />
              <stop offset="45%" style="stop-color: var(--curtain-mid)" stop-opacity="0.72" />
              <stop offset="76%" style="stop-color: var(--curtain-mid)" stop-opacity="0.28" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="curtain-glow-r" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color: var(--curtain-light)" stop-opacity="0.55" />
              <stop offset="60%" style="stop-color: var(--curtain-light)" stop-opacity="0.18" />
              <stop offset="100%" style="stop-color: var(--curtain-light)" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- Soft feathered cloud body -->
          <rect x="180" y="-40" width="760" height="1080" fill="url(#curtain-base-r)" />
          <!-- Fluffy billowy cloud puffs along the parting seam -->
          <ellipse cx="305" cy="105" rx="285" ry="240" fill="url(#curtain-puff-r)" />
          <ellipse cx="255" cy="315" rx="295" ry="255" fill="url(#curtain-puff-r)" />
          <ellipse cx="285" cy="540" rx="305" ry="260" fill="url(#curtain-puff-r)" />
          <ellipse cx="260" cy="760" rx="295" ry="250" fill="url(#curtain-puff-r)" />
          <ellipse cx="315" cy="940" rx="280" ry="230" fill="url(#curtain-puff-r)" />
          <!-- Soft luminous inner cloud highlights -->
          <ellipse cx="390" cy="245" rx="220" ry="185" fill="url(#curtain-glow-r)" />
          <ellipse cx="355" cy="525" rx="240" ry="195" fill="url(#curtain-glow-r)" />
          <ellipse cx="395" cy="780" rx="225" ry="185" fill="url(#curtain-glow-r)" />
        </svg>
      </div>
    </div>

    <!-- Full-page atmospheric sky with drifting clouds + short green field & right-side mountain behind footer -->
    <div id="scene-backdrop" class="scene-backdrop" aria-hidden="true"></div>

    <!-- Work-in-progress top banner -->
    <div id="wip-banner" role="status" class="wip-banner relative z-20 w-full border-b px-4 py-2.5">
      <div class="mx-auto flex max-w-[680px] items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 text-xs sm:text-[13px]">
          <span class="relative flex size-2 shrink-0" aria-hidden="true">
            <span class="wip-banner-ping absolute inline-flex h-full w-full animate-ping rounded-full bg-amber-400 opacity-70"></span>
            <span class="relative inline-flex size-2 rounded-full bg-amber-500"></span>
          </span>
          <p class="leading-snug">
            <span class="font-semibold">Work in progress</span>
            <span class="opacity-80"> — this site is actively being built and updated.</span>
          </p>
        </div>
        <button
          id="wip-banner-dismiss"
          type="button"
          aria-label="Dismiss work in progress banner"
          class="wip-banner-dismiss inline-flex size-6 shrink-0 cursor-pointer items-center justify-center rounded-md transition-colors outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Centered portfolio column (gaps let sky star hovers pass through) -->
    <div id="top" class="pointer-events-none relative z-10 mx-auto flex min-h-screen w-full max-w-[680px] flex-col px-6 pt-24 pb-12 sm:px-7 lg:pt-20 sm:pb-16">
      <!-- Top Bar: Brand Mark + Time-of-Day Selector & Social Buttons -->
      <header class="pointer-events-auto flex items-center justify-between gap-4">
        <div
          id="nav-brand-mark"
          aria-label="Ibraheem"
          class="ink-primary group inline-flex cursor-pointer items-center gap-2 rounded-lg"
        >
          <svg
            id="brand-i-svg"
            width="58"
            height="58"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="brand-i-svg size-13 transition-transform duration-300 group-hover:scale-105 sm:size-15"
            aria-hidden="true"
          >
            <defs>
              <!-- Centerline reveal mask so the variable-width brush stem draws smoothly stroke-by-stroke -->
              <mask id="brand-i-stem-mask" maskUnits="userSpaceOnUse">
                <path
                  id="brand-i-stem-reveal"
                  class="brand-i-stem-reveal"
                  d="M20 29.5 C24 25.5, 29.5 22.5, 33 23.5 C34.5 26.5, 26.5 39.5, 25 47.5 C23.8 53.8, 33.5 54, 48.5 40.8"
                  stroke="white"
                  stroke-width="18"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </mask>
            </defs>

            <!-- Expressive tapered brush-stroke dot (dabs in right after the stem finishes) -->
            <path
              id="brand-i-dot"
              class="brand-i-dot"
              d="M36.8 8.2C39.6 7.4 42.9 9.1 42.6 12.1C42.3 14.9 38.6 16.9 35.4 16.3C32.7 15.8 31.6 13.6 32.5 11.4C33.3 9.6 34.9 8.7 36.8 8.2Z"
              fill="currentColor"
            />
            <!-- Calligraphic variable-width brush-stroke 'i' stem revealed by the stroke mask -->
            <path
              id="brand-i-stem-fill"
              d="M19.8 28.4C22.4 25.1 27.6 21.8 32.4 21.3C35.2 21 37.3 22.8 36.7 25.9C35.8 30.8 31.1 40.6 29.7 46.2C29.1 48.6 30.2 50.1 32.5 49.8C36.6 49.3 42.3 45.4 47.4 40.2C48.4 39.2 49.8 40.3 48.9 41.6C44.2 48.3 36.8 55.6 28.6 56.2C22.9 56.6 19.6 52.7 20.9 46.5C22.3 39.8 26.9 31.6 28.4 27.9C28.8 26.8 28.1 26.2 26.9 26.7C24.8 27.5 22.6 29.2 21.1 30.4C20 31.3 18.9 29.6 19.8 28.4Z"
              fill="currentColor"
              mask="url(#brand-i-stem-mask)"
            />
          </svg>
        </div>

        <div class="flex items-center gap-2">
          <!-- Time-of-day expanding glass slider -->
          <div id="sky-time-mount"></div>
          <!-- Social icon buttons -->
          <div id="social-links" class="flex items-center gap-2"></div>
        </div>
      </header>

      <main class="mt-14 flex-1 space-y-24 sm:mt-20 sm:space-y-28">
        <!-- Hero: Name + Integrated View Counter + Short Description -->
        <section aria-labelledby="profile-name" class="pointer-events-auto">
          <div class="flex flex-nowrap items-center justify-between gap-2 sm:gap-4">
            <h1
              id="profile-name"
              class="ink-primary text-[1.35rem] leading-tight font-medium tracking-tight whitespace-nowrap sm:text-[2.35rem] sm:leading-[1.18]"
            >
              Hi, I'm <span class="font-brush ml-0.5 inline-block text-[1.22em] font-normal tracking-normal">Ibraheem</span>
            </h1>

            <!-- Built-in live visitor counter (matching top-bar box shape) -->
            <div
              id="visitor-counter-pill"
              class="hero-glass inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border px-2.5 font-mono text-[11px] sm:h-9 sm:gap-2 sm:px-3 sm:text-xs"
              title="Live visitor counter powered by AWS API Gateway, Lambda, and DynamoDB"
            >
              <span class="relative flex size-2">
                <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-65"></span>
                <span class="relative inline-flex size-2 rounded-full bg-emerald-500"></span>
              </span>
              <span class="opacity-75">views</span>
              <span id="visitor-count" class="font-semibold tabular-nums">--</span>
            </div>
          </div>

          <p
            id="profile-summary"
            class="ink-secondary mt-5 text-[15px] leading-[1.75] sm:text-base"
          ></p>
        </section>

        <!-- Experience Section -->
        <section id="experience" aria-labelledby="experience-heading" class="pointer-events-auto scroll-mt-16">
          <h2 id="experience-heading" class="ink-primary text-lg font-semibold tracking-tight sm:text-xl">
            Experience
          </h2>
          <div id="experience-list" class="mt-6 space-y-5"></div>
        </section>

        <!-- Projects Section -->
        <section id="projects" aria-labelledby="projects-heading" class="pointer-events-auto scroll-mt-16">
          <h2 id="projects-heading" class="ink-primary text-lg font-semibold tracking-tight sm:text-xl">
            Projects
          </h2>
          <div id="projects-grid" class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2"></div>
        </section>
      </main>

      <!-- Footer: "THANK YOU / Have a nice day" positioned cleanly above the bottom green field -->
      <footer id="site-footer" class="pointer-events-auto mt-28 pt-10 pb-36 sm:mt-36 sm:pt-12 sm:pb-44">
        <div id="thank-you-footer"></div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
