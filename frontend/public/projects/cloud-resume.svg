<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c63d6"/>
      <stop offset="38%" stop-color="#b685e3"/>
      <stop offset="68%" stop-color="#f2b2cc"/>
      <stop offset="100%" stop-color="#ffe0df"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72b46b"/>
      <stop offset="100%" stop-color="#4e8f53"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#539952"/>
      <stop offset="100%" stop-color="#2e6739"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Soft dreamy clouds -->
  <g filter="url(#blur)" opacity="0.85">
    <ellipse cx="140" cy="180" rx="150" ry="62" fill="#fff5f8"/>
    <ellipse cx="290" cy="210" rx="170" ry="68" fill="#ffffff"/>
    <ellipse cx="560" cy="175" rx="180" ry="66" fill="#fff4f7"/>
    <ellipse cx="700" cy="220" rx="140" ry="58" fill="#ffffff"/>
    <ellipse cx="420" cy="250" rx="340" ry="74" fill="#fff7fa"/>
  </g>

  <!-- Cloud bank -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="70" cy="310" r="78"/>
    <circle cx="170" cy="296" r="88"/>
    <circle cx="295" cy="308" r="95"/>
    <circle cx="430" cy="294" r="102"/>
    <circle cx="575" cy="306" r="92"/>
    <circle cx="705" cy="298" r="88"/>
  </g>

  <!-- Green rolling hills -->
  <path d="M0 360 Q210 295 430 340 T800 325 L800 500 L0 500 Z" fill="url(#hillBack)"/>
  <path d="M0 398 Q260 338 520 385 T800 368 L800 500 L0 500 Z" fill="url(#hillFront)"/>

  <!-- Miniature browser / portfolio preview card -->
  <g>
    <rect x="148" y="56" width="504" height="364" rx="18" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
    <!-- Top bar -->
    <circle cx="182" cy="88" r="10" fill="#18181b" opacity="0.85"/>
    <rect x="520" y="78" width="24" height="20" rx="5" fill="rgba(255,255,255,0.72)"/>
    <rect x="550" y="78" width="24" height="20" rx="5" fill="rgba(255,255,255,0.72)"/>
    <rect x="580" y="78" width="24" height="20" rx="5" fill="rgba(255,255,255,0.72)"/>
    <rect x="610" y="78" width="24" height="20" rx="5" fill="rgba(255,255,255,0.72)"/>

    <!-- Hero text mockup -->
    <rect x="172" y="124" width="190" height="20" rx="6" fill="#18181b" opacity="0.85"/>
    <rect x="172" y="154" width="330" height="10" rx="5" fill="#18181b" opacity="0.48"/>
    <rect x="172" y="172" width="265" height="10" rx="5" fill="#18181b" opacity="0.4"/>
    <!-- Visitor counter pill -->
    <rect x="172" y="196" width="128" height="22" rx="11" fill="rgba(255,255,255,0.82)"/>
    <circle cx="186" cy="207" r="4" fill="#16a34a"/>
    <rect x="197" y="203" width="84" height="8" rx="4" fill="#18181b" opacity="0.65"/>

    <!-- Experience card mockup -->
    <rect x="172" y="240" width="456" height="68" rx="12" fill="rgba(255,255,255,0.72)"/>
    <rect x="190" y="258" width="142" height="10" rx="5" fill="#18181b" opacity="0.78"/>
    <rect x="524" y="258" width="84" height="8" rx="4" fill="#18181b" opacity="0.38"/>
    <rect x="190" y="278" width="320" height="8" rx="4" fill="#18181b" opacity="0.36"/>
    <rect x="190" y="292" width="260" height="8" rx="4" fill="#18181b" opacity="0.28"/>

    <!-- Mini project cards -->
    <rect x="172" y="324" width="220" height="78" rx="12" fill="rgba(255,255,255,0.88)"/>
    <rect x="184" y="336" width="196" height="38" rx="7" fill="#c7d8f7"/>
    <rect x="184" y="382" width="90" height="8" rx="4" fill="#18181b" opacity="0.72"/>

    <rect x="408" y="324" width="220" height="78" rx="12" fill="rgba(255,255,255,0.88)"/>
    <rect x="420" y="336" width="196" height="38" rx="7" fill="#c7ead0"/>
    <rect x="420" y="382" width="104" height="8" rx="4" fill="#18181b" opacity="0.72"/>
  </g>
</svg>
